<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global TV Platformasi</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: white; text-align: center; margin: 0; padding: 20px; }
        .header { margin-bottom: 20px; }
        .header h1 { color: #e50914; margin: 0; font-size: 32px; }
        .header p { color: #aaa; font-size: 14px; }
        
        .container { max-width: 900px; margin: auto; }
        
        /* Pleyer dizayni */
        .player-wrapper { 
            border: 2px solid #222; border-radius: 12px; background: black; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; 
            aspect-ratio: 16 / 9; position: relative; margin-bottom: 20px;
        }
        video, iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
        iframe { display: none; } 

        /* Kategoriyalar dizayni */
        .categories {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .cat-btn {
            background: transparent; color: white; border: 2px solid #444; 
            padding: 8px 16px; border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .cat-btn:hover { background: #333; }
        .cat-btn.active { background: white; color: black; border-color: white; font-weight: bold; }

        /* Kanallar ro'yxati dizayni */
        .channels-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; }
        
        .channel-btn { 
            background: #222; color: white; border: 1px solid #444; 
            padding: 15px 10px; font-size: 14px; border-radius: 8px; 
            cursor: pointer; transition: all 0.3s ease; display: flex; 
            align-items: center; justify-content: center; gap: 8px; font-weight: 500;
        }
        .channel-btn:hover { background: #444; transform: translateY(-3px); }
        .channel-btn.active { background: #e50914; border-color: #e50914; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Global TV Onlayn</h1>
            <p>Jahon telekanallari bepul namoyishi</p>
        </div>
        
        <!-- Pleyer -->
        <div class="player-wrapper">
            <video id="tv-player" controls autoplay muted></video>
            <iframe id="iframe-player" src="" allowfullscreen></iframe>
        </div>

        <!-- Kategoriyalar Menyusi -->
        <div class="categories">
            <button class="cat-btn active" onclick="filterCategory('all', this)">Barchasi</button>
            <button class="cat-btn" onclick="filterCategory('news', this)">📰 Yangiliklar</button>
            <button class="cat-btn" onclick="filterCategory('sports', this)">🏎 Sport</button>
            <button class="cat-btn" onclick="filterCategory('edu', this)">🚀 Ilm-fan</button>
            <button class="cat-btn" onclick="filterCategory('movies', this)">🎬 Kino</button>
        </div>

        <!-- Kanallar -->
        <div class="channels-grid">
            <!-- YANGILIKLAR -->
            <button class="channel-btn" data-category="news" onclick="changeChannel('https://live-hls-web-aje.getaj.net/AJE/index.m3u8', 'm3u8', this)">
                Al Jazeera (EN)
            </button>
            <button class="channel-btn" data-category="news" onclick="changeChannel('https://tv-trtworld.medya.trt.com.tr/master.m3u8', 'm3u8', this)">
                TRT World
            </button>
            <button class="channel-btn" data-category="news" onclick="changeChannel('https://skynews-eu.rakuten.wurl.tv/playlist.m3u8', 'm3u8', this)">
                Sky News
            </button>
            <button class="channel-btn" data-category="news" onclick="changeChannel('https://news.cgtn.com/resource/live/english/cgtn-news.m3u8', 'm3u8', this)">
                CGTN (Xitoy)
            </button>

            <!-- SPORT -->
            <button class="channel-btn" data-category="sports" onclick="changeChannel('https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8', 'm3u8', this)">
                Red Bull TV
            </button>

            <!-- ILM-FAN (EDU) -->
            <button class="channel-btn" data-category="edu" onclick="changeChannel('https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8', 'm3u8', this)">
                NASA TV
            </button>

            <!-- KINO (MOVIES) -->
            <button class="channel-btn" data-category="movies" onclick="changeChannel('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'm3u8', this)" class="active">
                Kino (Test Kanal)
            </button>
        </div>
    </div>

    <script>
        var video = document.getElementById('tv-player');
        var iframe = document.getElementById('iframe-player');
        var hls = null;

        // Streamni yuklash
        function loadM3u8(url) {
            if (hls) { hls.destroy(); }
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() { video.play(); });
            }
        }

        // Kanalni o'zgartirish
        function changeChannel(url, type, btn) {
            // Barcha kanallardan active (qizil) rangni olish
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            // Bosilgan tugmani qizil qilish
            btn.classList.add('active');

            if (type === 'm3u8') {
                iframe.style.display = 'none';
                iframe.src = ''; 
                video.style.display = 'block';
                loadM3u8(url);
            }
        }

        // Kategoriyalarni filtrlash
        function filterCategory(cat, btn) {
            // Kategoriyalar tugmasi rangini o'zgartirish
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Kanallarni yashirish yoki ko'rsatish
            document.querySelectorAll('.channel-btn').forEach(channel => {
                // Agar 'all' tanlangan bo'lsa yoki kanalning datasi tanlangan kategoriyaga teng bo'lsa
                if (cat === 'all' || channel.getAttribute('data-category') === cat) {
                    channel.style.display = 'flex'; // grid ichida to'g'ri ko'rinishi uchun
                } else {
                    channel.style.display = 'none'; // yashirish
                }
            });
        }

        // Sayt ochilganda Test kanalni avtomatik yuklash
        loadM3u8('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8');
    </script>
</body>
</html>
