<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'zbek TV Platformasi</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: white; text-align: center; margin: 0; padding: 20px; }
        .header { margin-bottom: 20px; }
        .header h1 { color: #e50914; margin: 0; font-size: 32px; }
        .header p { color: #aaa; font-size: 14px; }
        
        .container { max-width: 900px; margin: auto; }
        
        .player-wrapper { 
            border: 2px solid #222; 
            border-radius: 12px; 
            background: black; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            overflow: hidden; 
            aspect-ratio: 16 / 9; /* Pleyer avtomatik to'g'ri hajmda bo'ladi */
            position: relative; 
            margin-bottom: 20px;
        }
        
        video, iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; }
        iframe { display: none; } 

        .channels-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 15px; 
        }
        
        button { 
            background: #222; color: white; border: 1px solid #444; 
            padding: 15px 10px; font-size: 15px; border-radius: 8px; 
            cursor: pointer; transition: all 0.3s ease; 
            font-weight: 500;
        }
        button:hover { background: #444; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        button.active { background: #e50914; border-color: #e50914; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📺 O'zbek va Xalqaro TV</h1>
            <p>Onlayn telekanallar namoyishi (Test rejimida)</p>
        </div>
        
        <!-- Video Pleyer -->
        <div class="player-wrapper">
            <video id="tv-player" controls autoplay muted></video>
            <iframe id="iframe-player" src="" allowfullscreen></iframe>
        </div>

        <!-- Kanallar ro'yxati -->
        <div class="channels-grid">
            <!-- 100% Ishlaydigan test va xalqaro kanallar -->
            <button onclick="changeChannel('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', 'm3u8', this)" class="active">
                🎬 Kino (Test)
            </button>
            <button onclick="changeChannel('https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8', 'm3u8', this)">
                🏎 Red Bull TV
            </button>
            
            <!-- O'zbek kanallari (m3u8 ssilkalar) -->
            <button onclick="changeChannel('https://live.uzreport.news/uzreport/uzreport/playlist.m3u8', 'm3u8', this)">
                📊 Uzreport TV
            </button>
            <button onclick="changeChannel('https://live.mtrk.uz/hls/navo.m3u8', 'm3u8', this)">
                🎵 Navo TV
            </button>
            <button onclick="changeChannel('https://live.mtrk.uz/hls/ozbekiston24.m3u8', 'm3u8', this)">
                🌍 O'zbekiston 24
            </button>
            <button onclick="changeChannel('https://live.mtrk.uz/hls/sport.m3u8', 'm3u8', this)">
                ⚽️️ Sport TV
            </button>
        </div>
    </div>

    <script>
        var video = document.getElementById('tv-player');
        var iframe = document.getElementById('iframe-player');
        var hls = null;

        function loadM3u8(url) {
            if (hls) { hls.destroy(); }
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() { video.play(); });
            }
        }

        function changeChannel(url, type, btn) {
            let buttons = document.querySelectorAll('.channels-grid button');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (type === 'm3u8') {
                iframe.style.display = 'none';
                iframe.src = ''; 
                video.style.display = 'block';
                loadM3u8(url);
            } else if (type === 'iframe') {
                if (hls) { hls.destroy(); }
                video.pause();
                video.style.display = 'none';
                iframe.style.display = 'block';
                iframe.src = url;
            }
        }

        // Birinchi bo'lib Test kanal ishga tushadi
        loadM3u8('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8');
    </script>
</body>
</html>
